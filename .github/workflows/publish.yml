name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine release channel
        id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-dev* ]]; then
            echo "branch=dev" >> "$GITHUB_OUTPUT"
            echo "npm_tag=dev" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag is on ${{ steps.channel.outputs.branch }}
        run: |
          git fetch origin ${{ steps.channel.outputs.branch }}
          git merge-base --is-ancestor ${{ github.sha }} origin/${{ steps.channel.outputs.branch }} || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build --if-present

      - name: Publish
        run: npm publish --access public --tag ${{ steps.channel.outputs.npm_tag }}
